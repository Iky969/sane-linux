# /etc/wpa_supplicant.conf -- S.A.N.E Linux minimal template
#
# SECURITY: this file may contain a pre-shared key or passphrase. Keep it
# root-owned and mode 0600; wpa_supplicant refuses to use a group/world
# readable configuration that holds secrets. The recipe stages it as 0600.
# (build-package.sh normalizes archive modes; enforce 0600 again during
# rootfs/image assembly.)
#
# Minimal WPA2-Personal (PSK) setup. Replace the example values below, or
# add networks at runtime with wpa_cli when update_config=1 is enabled.
#
# Generate a hashed PSK instead of a plaintext passphrase with:
#     wpa_passphrase "MY_SSID" "my-secret-passphrase"
# and paste the resulting psk=<hex> line into the network block.
#
# Active settings (safe defaults; no credentials ship with the package):
ctrl_interface=/run/wpa_supplicant
update_config=1

# Example network -- uncomment and edit before use:
#network={
#    ssid="MY_SSID"
#    psk="replace-with-wpa_passphrase-output"
#}
