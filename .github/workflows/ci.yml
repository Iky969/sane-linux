name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect leaked secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-smoke-test:
    runs-on: ubuntu-latest
    env:
      CFLAGS: "-static -O2 -Wall -Werror -fstack-protector-strong"
      # Suites MUST run the test binary: -DNINIT_TESTING is what compiles in the
      # NINIT_CGROUP_BASE override. A suite handed the production ./ninit would
      # silently lose its per-run cgroup isolation and touch the host hierarchy.
      BIN: "./ninit-test"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox-static python3 musl-tools musl-dev byacc bison shellcheck openssl

      - name: Static build
        run: make

      - name: Test build (production flags + -DNINIT_TESTING)
        run: make ninit-test

      - name: Strictly static binary check
        run: |
          if readelf -l ninit | grep -q 'INTERP'; then
            echo "FAIL: binary has INTERP (dynamic loader required)"; exit 1
          fi
          echo "OK: no INTERP -> static binary"

      - name: Lint log patterns, format strings & ShellCheck
        run: make lint

      - name: Record host cgroups before test battery
        run: |
          PRE=$(ls -d /sys/fs/cgroup/ninit* 2>/dev/null | tr '\n' ' ')
          echo "PRE_CGROUPS=$PRE" >> "$GITHUB_ENV"

      - name: Phase A account lifecycle & policy validation (root owner checks)
        run: sudo -E sh ./scripts/test-accounts.sh

      - name: Phase B networking (sane-net, DNS, DHCP, TLS)
        run: sh ./scripts/test-network.sh

      - name: Network fault injection & recovery suite
        run: sh ./scripts/test-network-fault.sh

      - name: Phase C reliability suite
        run: sh ./scripts/test-reliability.sh

      - name: Smoke test PID 1 (SIGTERM -> clean shutdown)
        run: sudo -E BIN=./ninit-test sh ./scripts/smoke-test.sh

      - name: SIGTERM delivered to service (not SIGKILL)
        run: sudo -E BIN=./ninit-test sh ./scripts/test-sigterm.sh

      - name: Dependencies, rescue mode, and line-by-line initctl
        run: sudo -E BIN=./ninit-test sh ./scripts/test-config.sh

      - name: Verify run-qemu.sh harness (log fixture, no QEMU)
        run: sh ./scripts/test-qemu-report.sh

      - name: Spawn failure paths (respawn dependency + fork EAGAIN)
        run: sudo -E BIN=./ninit-test sh ./scripts/test-spawn-failure.sh

      - name: cgroup v2 resource limits & respawn orphan cleanup
        run: sudo -E BIN=./ninit-test sh ./scripts/test-cgroup-limits.sh

      - name: Respawn cleanup & grandchild containment (T12)
        run: sudo -E BIN=./ninit-test sh ./scripts/test-respawn-cleanup.sh

      - name: State machine formalization & telemetry (T10/T11/T13)
        run: sudo -E BIN=./ninit-test sh ./scripts/test-state-machine.sh

      - name: Zombie reap stress (500 children)
        run: sudo -E BIN=./ninit-test sh ./scripts/test-zombie-reap-500.sh

      - name: Verify no lingering /sys/fs/cgroup/ninit* leaks
        run: |
          POST=$(ls -d /sys/fs/cgroup/ninit* 2>/dev/null | tr '\n' ' ')
          if [ "${PRE_CGROUPS:-}" != "$POST" ]; then
            echo "FAIL: new lingering cgroups detected in /sys/fs/cgroup/ninit*:" >&2
            echo "Before: ${PRE_CGROUPS:-}" >&2
            echo "After : $POST" >&2
            exit 1
          fi

      - name: Package builder & validator parity tests
        run: bash ./scripts/test-build-package.sh

      - name: SPM package manager adversarial & snippet parity suite
        run: bash ./scripts/test-spm.sh

      - name: ASan+UBSan parser fuzz harness
        run: sh ./scripts/fuzz-parsers.sh

      - name: Build with zero warnings (-Wall -Werror)
        run: make clean && make CFLAGS="-static -O2 -Wall -Werror -fstack-protector-strong"

  rootfs-distro:
    # scripts/build-rootfs.sh and scripts/run-qemu.sh are not used in the job above,
    # so the "make rootfs && make qemu" path could break unnoticed:
    # BusyBox defconfig compilation previously failed completely on newer kernel headers
    # without detection because nothing was building it.
    runs-on: ubuntu-latest
    env:
      CFLAGS: "-static -O2 -Wall -Werror -fstack-protector-strong"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox-static python3 musl-tools musl-dev byacc bison bzip2 cpio qemu-system-x86 curl

      - name: rootfs + initramfs from source (BUSYBOX_MODE=auto)
        run: |
          make
          make ninit-test
          sudo env SANE_WEAK_DEFAULT_CREDS=1 JOBS=$(nproc) sh ./scripts/build-rootfs.sh
          test -s distro/initramfs.cpio.gz

      - name: Prebuilt busybox symlink regression (dangling /bin/sh)
        run: sh ./scripts/test-build-rootfs.sh

      - name: Boot initramfs in QEMU (TCG, no /dev/kvm)
        run: sudo SECS=20 sh ./scripts/run-qemu.sh

      - name: Cross-layer integration test fstab <-> kernel <-> services (second QEMU boot)
        run: sudo env SANE_WEAK_DEFAULT_CREDS=1 SECS=40 sh ./scripts/test-integration.sh

      - name: Panic-path regression (QEMU)
        run: sudo -E BIN=./ninit-test sh ./scripts/test-kernel-panic-specific.sh

  boot-lifecycle:
    name: boot + account lifecycle scenarios (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CFLAGS: "-static -O2 -Wall -Werror -fstack-protector-strong"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox-static python3 musl-tools musl-dev \
            byacc bison bzip2 cpio curl qemu-system-x86 squashfs-tools dosfstools gdisk e2fsprogs

      - name: Build disk image
        run: make image

      - name: Run boot lifecycle suite
        run: make test-lifecycle

      - name: Upload lifecycle console logs
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: boot-lifecycle-logs
          path: /tmp/sane-lifecycle-logs/
          if-no-files-found: warn

  clawrza-packages:
    name: clawrza self-hosting recipes (build + spm install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build all three recipe packages
        run: |
          set -euo pipefail
          mkdir -p /tmp/clawrza-pkgs
          for p in clawrza-glibc-headers clawrza-binutils clawrza-gcc; do
            bash scripts/build-package.sh --source "packages/$p" --output /tmp/clawrza-pkgs
          done

      - name: No manifest drift
        run: git diff --exit-code -- packages/clawrza-glibc-headers packages/clawrza-binutils packages/clawrza-gcc

      - name: Install chain with spm and verify payload checksums
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          for p in \
            clawrza-glibc-headers-2.41-1-x86_64 \
            clawrza-binutils-2.44-1-x86_64 \
            clawrza-gcc-14.2.0-1-x86_64; do
            bash scripts/spm install "/tmp/clawrza-pkgs/$p.spm.tar.xz" --root "$root"
          done
          bash scripts/spm list --root "$root"
          ( cd "$root" && sha256sum -c "$GITHUB_WORKSPACE/packages/clawrza-gcc/.META/sha256" )
