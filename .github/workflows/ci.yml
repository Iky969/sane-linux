name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect leaked secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-smoke-test:
    runs-on: ubuntu-latest
    env:
      CFLAGS: "-static -O2 -Wall -Werror -fstack-protector-strong"
      # Suites MUST run the test binary: -DNINIT_TESTING is what compiles in the
      # NINIT_CGROUP_BASE override. A suite handed the production ./ninit would
      # silently lose its per-run cgroup isolation and touch the host hierarchy.
      BIN: "./ninit-test"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox-static python3

      - name: Static build
        run: make

      - name: Test build (production flags + -DNINIT_TESTING)
        run: make ninit-test

      - name: Strictly static binary check
        run: |
          if readelf -l ninit | grep -q 'INTERP'; then
            echo "FAIL: binary has INTERP (dynamic loader required)"; exit 1
          fi
          echo "OK: no INTERP -> static binary"

      - name: Lint log patterns & format strings
        run: make lint

      - name: Smoke test PID 1 (SIGTERM -> clean shutdown)
        run: sudo sh ./scripts/smoke-test.sh

      - name: SIGTERM delivered to service (not SIGKILL)
        run: sudo sh ./scripts/test-sigterm.sh

      - name: Dependencies, rescue mode, and line-by-line initctl
        run: sudo sh ./scripts/test-config.sh

      - name: Verify run-qemu.sh harness (log fixture, no QEMU)
        run: sh ./scripts/test-qemu-report.sh

      - name: Spawn failure paths (respawn dependency + fork EAGAIN)
        run: sudo sh ./scripts/test-spawn-failure.sh

      - name: cgroup v2 resource limits & respawn orphan cleanup
        run: sudo sh ./scripts/test-cgroup-limits.sh

      - name: Respawn cleanup & grandchild containment (T12)
        run: sudo sh ./scripts/test-respawn-cleanup.sh

      - name: State machine formalization & telemetry (T10/T11/T13)
        run: sudo sh ./scripts/test-state-machine.sh

      - name: ASan+UBSan parser fuzz harness
        run: sh ./scripts/fuzz-parsers.sh

      - name: Build with zero warnings (-Wall -Werror)
        run: make clean && make CFLAGS="-static -O2 -Wall -Werror -fstack-protector-strong"

  rootfs-distro:
    # scripts/build-rootfs.sh and scripts/run-qemu.sh are not used in the job above,
    # so the "make rootfs && make qemu" path could break unnoticed:
    # BusyBox defconfig compilation previously failed completely on newer kernel headers
    # without detection because nothing was building it.
    runs-on: ubuntu-latest
    env:
      CFLAGS: "-static -O2 -Wall -Werror -fstack-protector-strong"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox-static python3 bzip2 cpio qemu-system-x86 curl

      - name: rootfs + initramfs from source (BUSYBOX_MODE=auto)
        run: |
          make
          sudo JOBS=$(nproc) sh ./scripts/build-rootfs.sh
          test -s distro/initramfs.cpio.gz

      - name: Boot initramfs in QEMU (TCG, no /dev/kvm)
        run: sudo SECS=20 sh ./scripts/run-qemu.sh

      - name: Cross-layer integration test fstab <-> kernel <-> services (second QEMU boot)
        run: sudo SECS=40 sh ./scripts/test-integration.sh

      - name: Panic-path regression (QEMU)
        run: sudo sh ./scripts/test-kernel-panic-specific.sh
