name: test-image-boot

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dual-boot:
    name: Dual-boot headless QEMU verification (BIOS and UEFI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox-static python3 bzip2 cpio curl parted dosfstools mtools e2fsprogs gdisk squashfs-tools qemu-system-x86 ovmf

      - name: Build rootfs and initramfs
        run: |
          make
          sudo JOBS=$(nproc) sh ./scripts/build-rootfs.sh
          test -s distro/initramfs.cpio.gz

      - name: Build base SPM packages
        run: make packages

      - name: Build raw GPT disk image
        run: sudo bash scripts/make-image.sh --output distro/sane.img

      - name: Dual-boot headless QEMU verification (BIOS + UEFI)
        run: sudo bash scripts/test-image-boot.sh --all --timeout 30

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: qemu-image-boot-logs
          path: distro/qemu-image-console-*.log
          if-no-files-found: ignore
