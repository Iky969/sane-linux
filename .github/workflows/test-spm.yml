name: test-spm

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-spm-suite:
    name: S.A.N.E package builder and SPM package manager suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox-static python3 tar xz-utils curl

      - name: Run package builder tests (test-pkg)
        run: make test-pkg

      - name: Run SPM package manager suite (test-spm)
        run: |
          make test-spm
          echo "OK: All 20 SPM adversarial test scenarios passed"
