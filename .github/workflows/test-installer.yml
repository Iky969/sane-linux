name: test-installer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-installer:
    name: Guest offline installer verification (INST-50 / INST-51)
    runs-on: ubuntu-latest
    env:
      CFLAGS: "-static -O2 -Wall -Werror -fstack-protector-strong"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox-static python3 bzip2 cpio curl parted dosfstools mtools e2fsprogs gdisk squashfs-tools qemu-system-x86 ovmf musl-tools musl-dev byacc bison

      - name: Build rootfs and initramfs
        run: |
          make
          sudo env SANE_WEAK_DEFAULT_CREDS=1 JOBS=$(nproc) sh ./scripts/build-rootfs.sh
          test -s distro/initramfs.cpio.gz
          sudo chown -R $(id -u):$(id -g) distro/

      - name: Build base SPM packages
        run: make packages

      - name: Run offline installer test harness
        run: sudo bash scripts/test-installer.sh --timeout 30

      - name: Upload installer boot logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-installer-logs
          path: /tmp/sane-installer-*.log
          if-no-files-found: ignore
